name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Type-check
        run: bun run lint

      - name: Build for GitHub Pages
        run: bun run build
        env:
          VITE_BASE_PATH: /portfolio/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages serves the built Vite artifact
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in $(seq 1 18); do
            page="$(curl --fail --silent --show-error --location "$SITE_URL" || true)"

            if printf '%s' "$page" | grep -Fq 'src="/src/main.tsx"'; then
              echo "GitHub Pages is serving Vite source instead of the deployed artifact."
            else
              asset_path="$(printf '%s' "$page" | sed -n 's|.*src="\(/portfolio/assets/[^"]*\.js\)".*|\1|p' | head -n 1)"
              site_origin="$(printf '%s' "$SITE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"

              if [ -n "$asset_path" ] && curl --fail --silent --show-error --location "$site_origin$asset_path" > /dev/null; then
                echo "GitHub Pages is serving the built artifact."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "::error::GitHub Pages did not serve the built Vite artifact after deployment."
          exit 1
